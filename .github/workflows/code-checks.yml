name: Code checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: JavaScript and page assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Check local page assets
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
